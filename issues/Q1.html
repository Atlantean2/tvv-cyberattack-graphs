<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q1</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q1")</script></head><body><main id="issue"><h2 class="desk">Q1. Exploited Flaws</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-C1.webp" alt="Actively exploited flaws: CISA&#x27;s KEV catalog additions per month" loading="lazy"><figcaption><span class="t">Chart C1 (week of Oct 25, 2026). Actively exploited flaws: CISA&#x27;s KEV catalog additions per month</span><p>Every entry in CISA&#x27;s Known Exploited Vulnerabilities catalog is a flaw attackers are confirmed to be using in the wild. 2026 has already logged 272 additions (to Oct 23) vs 208 by the same date in 2025 and 245 in all of 2025; September 2026&#x27;s 43 was the busiest month since at least January 2023. October&#x27;s additions include many internet-facing edge and remote-access products (Fortinet, Palo Alto PAN-OS, Ivanti Connect Secure, Citrix NetScaler, BeyondTrust, Cisco). 2026 leaders: Microsoft 40, Cisco 19, Fortinet 9, Apple 9, Linux 8. The red &#x27;ransomware&#x27; share looks low for recent months partly because CISA adds that flag later, after campaigns are attributed.</p><p>Sources: <a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">CISA KEV catalog (JSON feed, release Oct 23, 2026)</a> <a href="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json">KEV JSON</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-C3.webp" alt="Microsoft owns 390 of 1,766 actively exploited flaws — 117 used in ransomware" loading="lazy"><figcaption><span class="t">Chart C3 (week of Oct 30, 2026). Microsoft owns 390 of 1,766 actively exploited flaws — 117 used in ransomware</span><p>CISA KEV entries by vendor (top 12), with known ransomware use marked; catalog v2026.10.30. Source: CISA KEV feed.</p><ul><li>Oct 30 2026: the catalog has 1,766 confirmed-exploited CVEs, and 361 of them are flagged as used in ransomware campaigns.</li><li>Microsoft has 390 entries (117 ransomware), Cisco 102, Apple 95, Adobe 83 and Google 76. Edge-device vendors (Fortinet, Ivanti, Citrix) have high ransomware shares.</li><li>In 2026 so far, CISA has added 282 CVEs, 40 of them Microsoft. Unlike C1, this chart is a vendor view, not a monthly count.</li></ul><p>Sources: <a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">CISA Known Exploited Vulnerabilities catalog</a> <a href="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json">CISA KEV JSON feed</a></p></figcaption></figure></main></body></html>
