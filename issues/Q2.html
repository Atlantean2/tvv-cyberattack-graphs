<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q2</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Shutdowns</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-C2.webp" alt="Government internet shutdowns: by cause, and how much the counts disagree" loading="lazy"><figcaption><span class="t">Chart C2 (week of Oct 25, 2026). Government internet shutdowns: by cause, and how much the counts disagree</span><p>Internet Society Pulse logs 98 shutdowns in 2025 and 63 so far in 2026 (latest: a Delhi mobile-internet cut during protests on Oct 9-10, which Pulse lists as unconfirmed). Exams are a surprisingly large cause (Iraq and Syria cut the internet nationally for school tests). But Access Now&#x27;s #KeepItOn coalition, using broader criteria, recorded a record 313 shutdowns in 52 countries in 2025, up from 304 in 2024, with Myanmar (95) the top offender and conflict the leading trigger (40%). The gap between the two counts is largely a matter of definitions and verification standards, so neither number alone is &#x27;the&#x27; total.</p><p>Sources: <a href="https://pulse.internetsociety.org/shutdowns/download/">Internet Society Pulse, shutdowns data download</a> <a href="https://www.accessnow.org/press-release/rising-and-resisting-in-the-darkness-internet-shutdowns-in-2025/">Access Now, Internet shutdowns in 2025 (Mar 31, 2026)</a></p></figcaption></figure></main></body></html>
