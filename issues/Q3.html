<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q3</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q3")</script></head><body><main id="issue"><h2 class="desk">Q3. Ransomware &amp; Costs</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-30-C4.webp" alt="Americans reported a record $20.9B lost to internet crime in 2025, up 26%" loading="lazy"><figcaption><span class="t">Chart C4 (week of Oct 30, 2026). Americans reported a record $20.9B lost to internet crime in 2025, up 26%</span><p>Reported IC3 losses rose from $4.2B (2020) to $20.9B (2025) on 1.0M complaints. Source: FBI IC3 2025 report.</p><ul><li>2025: $20.877B lost on 1,008,597 complaints, up 26% from $16.6B in 2024.</li><li>Cyber-enabled fraud made up $17.7B (85%) of losses; crypto-related losses were $11.4B and investment scams $7.2B.</li><li>Ransomware reported to IC3 was only 3,600+ complaints and $32M+, because victims mostly don&#x27;t report business-loss costs.</li></ul><p>Sources: <a href="https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf">FBI IC3 2025 Internet Crime Report (PDF)</a> <a href="https://www.ic3.gov/">FBI Internet Crime Complaint Center</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-C5.webp" alt="Average data breach now costs a record $4.99M globally — $11.5M in the US" loading="lazy"><figcaption><span class="t">Chart C5 (week of Oct 30, 2026). Average data breach now costs a record $4.99M globally — $11.5M in the US</span><p>Global average breach cost a record $4.99M in 2026 (+12%); US $11.5M. Source: IBM Cost of a Data Breach 2026.</p><ul><li>The 2026 report covers 602 organizations breached between Mar 2025 and Feb 2026. The global average was $4.99M, up 12% after a dip to $4.44M in 2025.</li><li>The US average was $11.50M (2025: $10.22M), a record and more than double the global figure.</li><li>39% of breached organizations were hit by ransomware, up from 24% in 2023.</li></ul><p>Sources: <a href="https://www.ibm.com/reports/data-breach">IBM Cost of a Data Breach report</a> <a href="https://assets.ibm.com/adobe/assets/urn%3Aaaid%3Aaem%3A21111142-1251-4369-86fb-57b82f5bb108/original/as/Cost%20of%20a%20Data%20Breach%20Report%202026.pdf">IBM Cost of a Data Breach Report 2026 (PDF)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-C6.webp" alt="Ransomware leak-site victims: 8,421 so far in 2026, already past 2025&#x27;s 8,077" loading="lazy"><figcaption><span class="t">Chart C6 (week of Oct 30, 2026). Ransomware leak-site victims: 8,421 so far in 2026, already past 2025&#x27;s 8,077</span><p>Victims posted on ransomware leak sites per month, through Oct 30 2026. Tracker data from ransomware.live, not confirmed incidents.</p><ul><li>Yearly totals: 3,168 (2022), 5,411 (2023), 6,057 (2024), 8,077 (2025) and 8,421 in 2026 through Oct 30.</li><li>Aug 2026 was the record month with 1,056 victims, led by Qilin (159) and The Gentlemen (116).</li><li>Feb 2025 shows a spike of 1,057, including 335 from Cl0p&#x27;s mass posting.</li></ul><p>Sources: <a href="https://www.ransomware.live/">ransomware.live tracker</a> <a href="https://api.ransomware.live/v2/victims/2026/10">ransomware.live API, victims Oct 2026</a></p></figcaption></figure></main></body></html>
