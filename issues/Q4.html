<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. AI-Enabled Attacks</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-30-C7.webp" alt="FBI: AI-linked scams cost victims $893M in 2025 — $632M in fake investments" loading="lazy"><figcaption><span class="t">Chart C7 (week of Oct 30, 2026). FBI: AI-linked scams cost victims $893M in 2025 — $632M in fake investments</span><p>2025 IC3 complaints referencing AI: $893M losses, top 10 crime types (log scale). Source: FBI IC3 2025.</p><ul><li>2025: 22,364 complaints referenced AI, with $893.3M in adjusted losses.</li><li>Investment scams with an AI link accounted for $632.0M, BEC $30.3M, tech support $19.5M, romance $19.0M and employment $12.6M.</li><li>IBM 2026: AI-driven attacks rose 56%, and AI-driven malicious breaches averaged $6.04M vs $5.03M for non-AI ones.</li></ul><p>Sources: <a href="https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf">FBI IC3 2025 Internet Crime Report (PDF)</a> <a href="https://www.ibm.com/reports/data-breach">IBM Cost of a Data Breach report</a></p></figcaption></figure></main></body></html>
