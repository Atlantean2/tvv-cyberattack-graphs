<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q5</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q5")</script></head><body><main id="issue"><h2 class="desk">Q5. Crypto Heists</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-01-C8.webp" alt="One North Korea-linked hack made 2026 the worst crypto-theft year: $8.7B" loading="lazy"><figcaption><span class="t">Chart C8 (week of Nov 1, 2026). One North Korea-linked hack made 2026 the worst crypto-theft year: $8.7B</span><p>DefiLlama&#x27;s hacks database records $8.7B stolen in 2026 through Oct 31, more than double the previous record (2020, $4.0B, inflated by the $3.5B LuBian theft). The Oct 29 Binance theft alone is $6.36B, which TRM Labs calls the largest crypto theft on record. TRM attributes it with high confidence to North Korea&#x27;s TraderTraitor unit. Without Binance, 2026 would be $2.4B, slightly below 2025&#x27;s $2.7B, so a single breach made the record. TRM counts about $2.7B of the Binance loot frozen by stablecoin issuers and Arbitrum, which DefiLlama&#x27;s gross figure does not net out.</p><ul><li>Attack path (TRM): Binance hot-wallet signing infrastructure on 10 chains, plus 50 pre-signed EIP-7702 authorizations on Ethereum.</li><li>Binance has not yet published a root cause. CoinDesk reports a compromised DevOps laptop and further breach points.</li></ul><p class="nt">Note: Amounts are gross amounts stolen at the time of theft; recoveries, freezes and returns are not netted out. DefiLlama coverage before 2018 is thin.</p><p>Sources: <a href="https://defillama.com/hacks">DefiLlama Hacks database</a> <a href="https://api.llama.fi/hacks">DefiLlama API /hacks</a> <a href="https://www.trmlabs.com/resources/blog/north-korea-steals-usd-6-36-billion-from-binance-in-the-largest-hack-in-history">TRM Labs, North Korea Steals USD 6.36 Billion From Binance</a> <a href="https://www.binance.com/en/support/announcement/detail/c5a8729a97ac486d963784d96c5642d7">Binance, Security Incident Update (2026-10-30)</a> <a href="https://www.coindesk.com/tech/2026/10/30/binance-uncovers-wider-breach-in-usd6-3-billion-exploit-targets-sunday-withdrawal-restart">CoinDesk, Binance discovers multiple breach points (Oct 30, 2026)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-C9.webp" alt="North Korea is tied to 4 of the 13 biggest crypto heists, led by Binance" loading="lazy"><figcaption><span class="t">Chart C9 (week of Nov 1, 2026). North Korea is tied to 4 of the 13 biggest crypto heists, led by Binance</span><p>The 13 largest crypto hacks in DefiLlama&#x27;s database, valued at the time of theft. Red marks thefts officially attributed to North Korea: Binance 2026 (TRM Labs), Bybit 2025 (FBI), Ronin 2022 (FBI) and DMM Bitcoin 2024 (FBI with Japan&#x27;s NPA). Together the four come to about $8.7B. Binance&#x27;s $6.36B is 4.5x Bybit&#x27;s $1.40B and 1.8x the next-largest, LuBian&#x27;s $3.5B (2020). The others in the top 13 (LuBian, Poly Network, Coincheck, Mt. Gox, FTX and more) are not shown as attributed here. Centralized-exchange hot wallets, not DeFi code bugs, account for the biggest losses.</p><p class="nt">Note: Binance attribution is TRM&#x27;s private-sector assessment (high confidence); as of Nov 1 we found no FBI statement. DefiLlama values Bybit at $1.40B; TRM and FBI cite about $1.5B.</p><p>Sources: <a href="https://defillama.com/hacks">DefiLlama Hacks database</a> <a href="https://www.trmlabs.com/resources/blog/north-korea-steals-usd-6-36-billion-from-binance-in-the-largest-hack-in-history">TRM Labs on Binance (Oct 29, 2026)</a> <a href="https://www.ic3.gov/PSA/2025/PSA250226">FBI PSA on Bybit (Feb 26, 2025)</a> <a href="https://www.fbi.gov/news/press-releases/fbi-statement-on-attribution-of-malicious-cyber-activity-posed-by-the-democratic-peoples-republic-of-korea">FBI statement on Ronin attribution (Apr 14, 2022)</a> <a href="https://www.fbi.gov/news/press-releases/fbi-dc3-and-npa-identification-of-north-korean-cyber-actors-tracked-as-tradertraitor-responsible-for-theft-of-308-million-from-bitcoindmmcom">FBI/DC3/NPA on DMM Bitcoin (Dec 2024)</a></p></figcaption></figure></main></body></html>
