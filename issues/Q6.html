<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q6</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q6")</script></head><body><main id="issue"><h2 class="desk">Q6. Leak Sites</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-C12.webp" alt="Ransomware leak-site victims up 25% in 2026; Europe and Asia rise faster than the US" loading="lazy"><figcaption><span class="t">Chart C12 (week of Nov 15, 2026). Ransomware leak-site victims up 25% in 2026; Europe and Asia rise faster than the US</span><p>Organisations named on ransomware gangs&#x27; leak sites, as tracked by ransomware.live, comparing the same 5 months of 2026 and 2025 (Jan, Mar, May, Jun, Oct; other months could not be downloaded completely). Victims rose from 3,297 to 4,124 (+25%). The United States still accounts for the most named victims (1,563) but grew only +4%; Germany (+44%), the United Kingdom (+50%), Italy (+61%), Mexico (+121%), Taiwan (+90%) and Thailand (+130%) rose much faster, while Canada fell (-30%). Among gangs, Qilin remains the most prolific; &#x27;The Gentlemen&#x27; went from 14 to 426 victims, while Akira, Play and SafePay posted fewer.</p><ul><li>Monthly totals available (2026): Jan 736, Feb 797, Mar 819, May 766, Jun 707, Jul 962, Aug 1,056, Oct 1,096; November 1–14: 514.</li><li>Victims with no country recorded: 116 in 2025, 351 in 2026 (same months); they are left out of the country panel.</li><li>Fast risers: LockBit 5 (39 → 155), NightSpire (52 → 152) and N0n (none → 103). Groups rebrand often, so group-level trends are less reliable than totals.</li><li>This is a different cut from chart C6 (monthly totals): it shows where victims are and which gangs post them.</li></ul><p class="nt">Note: Leak-site counts include only victims a gang chose to name publicly; victims who pay quickly are usually not listed, and some posts are false or recycled claims. Months are ransomware.live&#x27;s attack/discovery month. Country codes are as recorded by ransomware.live. The country panel uses a scale that is linear to 200 and compressed above it so the US bar fits.</p><p>Sources: <a href="https://api.ransomware.live/v2/victims/2026/10">ransomware.live API v2: victims by month (downloaded Nov 15 2026)</a> <a href="https://www.ransomware.live/about">ransomware.live: about the data and methodology</a> <a href="https://www.ncsc.gov.uk/collection/annual-review-2026/understanding-threat/incident-management">NCSC Annual Review 2026: incident management (context)</a> <a href="https://therecord.media/poland-shuts-down-government-services-platform-cyberattack">The Record: Poland shuts down government services platform after cyberattack</a></p></figcaption></figure></main></body></html>
