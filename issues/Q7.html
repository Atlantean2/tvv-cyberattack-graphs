<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Cyberattack Graphs — Q7</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. UK Incidents</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-C13.webp" alt="UK &#x27;nationally significant&#x27; cyber incidents fell from a record 204 to 80" loading="lazy"><figcaption><span class="t">Chart C13 (week of Nov 15, 2026). UK &#x27;nationally significant&#x27; cyber incidents fell from a record 204 to 80</span><p>Cyber incidents handled by the UK National Cyber Security Centre&#x27;s Incident Management team each year (September–August), the number classed as &#x27;nationally significant&#x27; (the top three of six government categories), and the reports received (black line). In its 2026 Annual Review the NCSC said it received 1,831 reports, supported 337 incidents and classed 80 as nationally significant, down from a record 204 in 2024–25, when 48% of all incidents reached that level. The 2025 review blamed that spike partly on mass exploitation of a few edge-device flaws (Ivanti, Fortinet) by a small number of actors. The fall is real in the NCSC&#x27;s own count, but one year after a record is too short to call a trend.</p><ul><li>Highly significant (Category 2) incidents rose for three straight years: 1 (2021–22), 4, 12, 18 (2024–25). The 2026 review gives no Category 2 count.</li><li>Through its Early Warning service the NCSC also notified 8,500 organisations of suspected compromises in 2025–26.</li><li>The NCSC itself flagged that the 2022–23 jump in reports reflects a change in data collection and is not directly comparable.</li><li>Counterpoint this week: the NCSC warned of AI-enabled attacks on critical infrastructure in the coming months, and Poland had to shut its ePUAP government-services platform after a cyberattack.</li></ul><p class="nt">Note: Years run September to August. &#x27;Nationally significant&#x27; = Categories 1–3 of the joint NCSC/law-enforcement model; the 2021–22 figure is 63 in the 2022 and 2025 reviews (62 in one 2024 table). Counts reflect incidents reported to or found by the NCSC, not all UK incidents.</p><p>Sources: <a href="https://www.ncsc.gov.uk/collection/annual-review-2026/understanding-threat/incident-management">NCSC Annual Review 2026: incident management</a> <a href="https://www.ncsc.gov.uk/collection/ncsc-annual-review-2025/chapter-01-cyber-threat-to-the-uk/incident-management">NCSC Annual Review 2025: incident management (table 2021–22 to 2024–25)</a> <a href="https://www.ncsc.gov.uk/collection/ncsc-annual-review-2024/chapter-01">NCSC Annual Review 2024, chapter 1</a> <a href="https://www.publictechnology.net/2026/11/11/energy/ncsc-warns-of-ai-attacks-on-critical-infrastructure-in-coming-months/">PublicTechnology, Nov 11 2026: NCSC warns of AI attacks on critical infrastructure in coming months</a> <a href="https://therecord.media/poland-shuts-down-government-services-platform-cyberattack">The Record: Poland shuts down government services platform after cyberattack</a></p></figcaption></figure></main></body></html>
